version: '3.8'

services:
  money-os:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: money-os-app
    ports:
      - "3000:3000"
    restart: always
    env_file:
      - frontend/web/.env.local
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    container_name: money-os-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - money-os
    restart: always
